# Ejecuta comandos enviados desde la consola web.
# Disparado por repository_dispatch (frontend) o manualmente (workflow_dispatch).
name: console-run

on:
  repository_dispatch:
    types: [console_run]
  workflow_dispatch:
    inputs:
      command:
        description: "Comando a ejecutar en el runner"
        required: true
        default: "ls -la"

# GITHUB_TOKEN necesita contents:write para commitear la salida (runs/).
permissions:
  contents: write
  actions: read

# Solo una ejecución a la vez: serializa el acceso y limita el abuso
# (cola natural + cuota de Actions del repositorio).
concurrency:
  group: console-run
  cancel-in-progress: false

env:
  CONSOLE_MODE: ${{ vars.CONSOLE_MODE }}
  CONSOLE_TIMEOUT: ${{ vars.CONSOLE_TIMEOUT }}
  CONSOLE_IMAGE: ${{ vars.CONSOLE_IMAGE }}
  CONSOLE_EXTRA_COMMANDS: ${{ vars.CONSOLE_EXTRA_COMMANDS }}

jobs:
  run:
    runs-on: ubuntu-latest
    # Límite duro de todo el job (setup + ejecución + commit).
    timeout-minutes: 10

    # Autorización: si CONSOLE_ALLOWED_USERS está vacío, puede ejecutar quien
    # tenga un token con actions:write sobre el repo (GitHub ya lo impone).
    # Si está definida (JSON: ["usuario1","usuario2"]), se restringe a ellos.
    if: ${{ vars.CONSOLE_ALLOWED_USERS == '' || contains(fromJSON(vars.CONSOLE_ALLOWED_USERS), github.actor) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout deja el GITHUB_TOKEN en .git/config (extraheader).
      # El sandbox es una copia SIN .git, pero así tampoco se puede leer la
      # credencial por ruta absoluta (p.ej. cat /home/runner/work/.../.git/config).
      - name: Eliminar credenciales persistidas del workspace
        run: git config --unset-all "http.https://github.com/.extraheader" || true

      - name: Instalar herramientas GUI (opcional)
        if: vars.CONSOLE_INSTALL_GUI_TOOLS == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick x11-apps

      - name: Preparar Docker (solo modo docker)
        if: vars.CONSOLE_MODE == 'docker'
        run: docker info

      # El token NO viaja en el entorno del paso principal (sería legible vía
      # /proc/<pid>/environ desde el propio comando: el runner hosted no aísla
      # por namespace). Se escribe en un archivo efímero con permisos 600 que el
      # runner lee y BORRA antes de ejecutar cualquier cosa.
      - name: Preparar token efímero
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          TOKEN_FILE="$RUNNER_TEMP/console-token.$RANDOM$$"
          printf '%s' "$GITHUB_TOKEN" > "$TOKEN_FILE"
          echo "CONSOLE_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"

      - name: Ejecutar comando en sandbox
        env:
          # CONSOLE_TOKEN_FILE es solo una RUTA (inofensiva). El token en sí
          # nunca está en el entorno de este paso.
          # El valor de client_payload/command NO se re-evalúa por el shell:
          # va entre comillas dobles, así que "$COMANDO" llega literal a Python.
          COMANDO: ${{ github.event.client_payload.command || inputs.command }}
          RUN_ID: ${{ github.event.client_payload.id || github.run_id }}
        run: |
          python3 runner/run_command.py \
            --id "$RUN_ID" \
            --command "$COMANDO" \
            --workspace "$GITHUB_WORKSPACE" \
            --runs-dir "$GITHUB_WORKSPACE/runs" \
            --timeout "${CONSOLE_TIMEOUT:-30}" \
            --mode "${CONSOLE_MODE:-allowlist}" \
            --image "${CONSOLE_IMAGE:-ubuntu:24.04}" \
            --actor "${{ github.actor }}" \
            --stream-interval 3
